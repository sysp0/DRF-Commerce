[project.urls]
Homepage = "https://example.com"
Documentation = "https://readthedocs.org"
Repository = "https://github.com/sysp0/DRF-Commerce"
Issues = "https://github.com/sysp0/DRF-Commerce/issues"
Changelog = "https://github.com/sysp0/DRF-Commerce/blob/main/CHANGELOG.md"

[project]
name = "drf-commerce"
authors = [{ name = "Reza Ghasemi", email = "syspo8@gmail.com" }]
version = "0.0.0"
keywords = ["django", "web", "api", "rest", "backend", "DevOps"]
classifiers = [
    "Framework :: Django",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
description = "DRF-Commerce is a real online shop made to show skills in Django, DRF, and DevOps."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "attrs>=25.4.0",
    "boto3>=1.40.69",
    "celery>=5.5.3",
    "django==5.2.8",
    "django-celery-beat>=2.8.1",
    "django-celery-results>=2.6.0",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.12.0",
    "django-extensions>=4.1",
    "django-filter>=25.2",
    "django-redis>=6.0.0",
    "django-storages>=1.14.6",
    "djangorestframework>=3.16.1",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-jwt>=1.19.2",
    "drf-spectacular>=0.29.0",
    "factory-boy>=3.3.3",
    "faker>=37.12.0",
    "pillow>=12.0.0",
    "psycopg2-binary>=2.9.11",
    "pytest>=9.0.0",
    "pytest-django>=4.11.1",
    "whitenoise>=6.11.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.django.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--reuse-db --disable-warnings"

[tool.mypy]
plugins = [
    "mypy_django_plugin.main",
    "mypy_drf_plugin.main",
]
ignore_missing_imports = false
strict_optional = true
disallow_untyped_defs = true
python_version = "3.10"

[tool.django-stubs]
django_settings_module = "config.django.base"

[dependency-groups]
dev = [
    "boto3-stubs>=1.40.69",
    "django-redis>=6.0.0",
    "django-stubs>=5.2.7",
    "djangorestframework-stubs>=3.16.5",
    "drf-spectacular>=0.29.0",
    "factory-boy>=3.3.3",
    "faker>=37.12.0",
    "flake8>=7.3.0",
    "ipdb>=0.13.13",
    "ipython>=8.37.0",
    "mypy>=1.18.2",
    "pytest>=9.0.0",
    "pytest-django>=4.11.1",
]
prod = [
    "gunicorn>=23.0.0",
    "sentry-sdk>=2.43.0",
]


[[tool.mypy.overrides]]
module = ["config.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["*.migrations.*", "tests.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["django_celery_beat.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["django_filters.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["factory.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["rest_framework_jwt.*"]
ignore_missing_imports = true

[tool.flake8]
max-line-length = 120
exclude = [
    ".git",
    "__pycache__",
    "*/migrations/*"
]